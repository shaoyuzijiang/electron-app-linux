<!DOCTYPE html>
<!--
  「关于」对话框内容（见 utils/about-dialog-window.js）。
  版本信息和 logo 的 file:// URL 均由主进程通过 URL query 注入：
  appName / appVersion / sdkVersion / logo。
  logo 不能用 asar 内相对路径引用——electron-builder 会把被
  extraResources/icon 引用的源文件排除出 asar，因此由主进程注入
  真实文件的绝对路径。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>关于</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #card {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin-bottom: 12px;
      -webkit-user-drag: none;
    }
    #app-name {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .version-line {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
      white-space: nowrap;
    }
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 24px;
      height: 24px;
      line-height: 22px;
      text-align: center;
      font-size: 14px;
      color: #999;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    #close-btn:hover {
      background: #f0f0f0;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="card">
    <button id="close-btn" title="关闭">&#10005;</button>
    <img id="logo" src="" alt="logo" />
    <div id="app-name"></div>
    <div class="version-line" id="app-version"></div>
    <div class="version-line" id="sdk-version"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var logoUrl = params.get('logo');
      if (logoUrl) document.getElementById('logo').src = logoUrl;
      document.getElementById('app-name').textContent = params.get('appName') || '';
      document.getElementById('app-version').textContent =
        '应用版本: ' + (params.get('appVersion') || '-');
      document.getElementById('sdk-version').textContent =
        '腾讯会议 SDK 版本: ' + (params.get('sdkVersion') || '未加载');

      function closeDialog() {
        window.close();
      }
      document.getElementById('close-btn').addEventListener('click', closeDialog);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDialog();
      });
    })();
  </script>
</body>
</html>
