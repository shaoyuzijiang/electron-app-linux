<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议SDK Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.92;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .remember-row label {
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>欢迎登录</h1>
    <p class="subtitle">请输入您的邮箱和密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberPassword" />
        <label for="rememberPassword">记住密码</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="register-link">还没有账号？<a id="registerLink">注册账号</a></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const rememberCb = document.getElementById('rememberPassword');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // 读取记住的邮箱密码
    const savedEmail = localStorage.getItem('remembered_email');
    const savedPassword = localStorage.getItem('remembered_password');
    if (savedEmail) {
      emailInput.value = savedEmail;
      passwordInput.value = savedPassword || '';
      rememberCb.checked = true;
    }

    // 注册链接
    document.getElementById('registerLink').addEventListener('click', (e) => {
      e.preventDefault();
      window.electronAPI.openExternal('https://wemeetapp.liuqi92.cn/user-center/register');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMsg.textContent = '';

      if (!email || !password) {
        errorMsg.textContent = '请输入邮箱和密码';
        return;
      }

      // 邮箱格式校验
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMsg.textContent = '请输入有效的邮箱地址';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const result = await window.electronAPI.login(email, password);

        if (result.success) {
          // 记住密码逻辑
          if (rememberCb.checked) {
            localStorage.setItem('remembered_email', email);
            localStorage.setItem('remembered_password', password);
          } else {
            localStorage.removeItem('remembered_email');
            localStorage.removeItem('remembered_password');
          }
          window.electronAPI.loginSuccess();
        } else {
          errorMsg.textContent = result.message || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查连接后重试';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
