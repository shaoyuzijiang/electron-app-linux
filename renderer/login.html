<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议SDK Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.92;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .remember-row label {
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    /* ========== 多账号下拉选择 ========== */
    .email-wrapper {
      position: relative;
    }

    .email-input-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .email-input-row input {
      flex: 1;
      min-width: 0;
    }

    .email-toggle {
      flex-shrink: 0;
      padding: 0 12px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .email-toggle:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    .email-toggle.active {
      background: #eef2ff;
      border-color: #667eea;
    }

    .email-toggle[hidden] {
      display: none;
    }

    .email-toggle svg {
      width: 16px;
      height: 16px;
      color: #6b7280;
      transition: transform 0.2s;
    }

    .email-toggle.active svg {
      transform: rotate(180deg);
      color: #667eea;
    }

    .accounts-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .accounts-dropdown.show {
      display: block;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.12s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .account-item:hover {
      background: #f3f4f6;
    }

    .account-item + .account-item {
      border-top: 1px solid #f3f4f6;
    }

    .account-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
    }

    .account-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-info {
      flex: 1;
      min-width: 0;
    }

    .account-email {
      font-size: 14px;
      color: #1a1a2e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-name {
      font-size: 12px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-delete {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: #9ca3af;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .account-delete:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .account-delete svg {
      width: 14px;
      height: 14px;
    }

    .account-clear-all {
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: #f9fafb;
      color: #6b7280;
      font-size: 12px;
      cursor: pointer;
      border-top: 1px solid #e5e7eb;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }

    .account-clear-all:hover {
      background: #f3f4f6;
      color: #ef4444;
    }

    /* ========== 设置入口（齿轮按钮） ========== */
    .settings-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      -webkit-app-region: no-drag;
      z-index: 50;
    }

    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .settings-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ========== 设置弹窗 ========== */
    .settings-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .settings-modal-overlay.show {
      display: flex;
    }

    .settings-modal {
      background: #fff;
      border-radius: 16px;
      padding: 32px 32px 24px;
      width: 440px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .settings-modal h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .settings-modal .settings-subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .settings-modal .form-group {
      margin-bottom: 16px;
    }

    .settings-modal .url-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* 环境选择下拉框 */
    .settings-modal select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #1a1a2e;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236b7280'%3E%3Cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 011.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 36px;
    }

    .settings-modal select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    /* 自定义 URL 输入框（仅选择"自定义"时显示） */
    .custom-url-group {
      display: none;
      margin-top: 12px;
    }

    .custom-url-group.show {
      display: block;
    }

    .settings-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .settings-modal-actions button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #d1d5db;
      transition: background 0.15s;
      font-family: inherit;
    }

    .settings-modal-actions .btn-cancel {
      background: #fff;
      color: #374151;
    }

    .settings-modal-actions .btn-cancel:hover {
      background: #f3f4f6;
    }

    .settings-modal-actions .btn-reset {
      background: #fff;
      color: #6b7280;
      flex: 0 0 auto;
      padding: 10px 14px;
    }

    .settings-modal-actions .btn-reset:hover {
      background: #f3f4f6;
      color: #ef4444;
    }

    .settings-modal-actions .btn-save {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
    }

    .settings-modal-actions .btn-save:hover {
      opacity: 0.92;
    }

    .settings-modal-actions .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .settings-modal .settings-status {
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
      text-align: center;
    }

    .settings-modal .settings-status.success {
      color: #10b981;
    }

    .settings-modal .settings-status.error {
      color: #ef4444;
    }

    /* ========== 注册页（内嵌 webview） ========== */
    .register-page {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .register-page.active {
      display: flex;
    }

    .register-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: #f5f5f7;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
      -webkit-app-region: drag; /* 允许拖动窗口 */
    }

    .register-toolbar button {
      -webkit-app-region: no-drag;
    }

    .register-toolbar .toolbar-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .register-back-btn {
      padding: 6px 14px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .register-back-btn:hover {
      background: #f3f4f6;
    }

    .register-container {
      flex: 1;
      position: relative;
      background: #fff;
      /* WebContentsView 会精确覆盖此区域 */
    }

    .register-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 13px;
      gap: 10px;
      pointer-events: none;
    }

    .register-loading::before {
      content: '';
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 注册页激活时隐藏登录卡 */
    body.register-mode .login-card {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 设置入口 -->
  <button type="button" class="settings-btn" id="settingsBtn" title="服务端设置" aria-label="服务端设置">
    <svg viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M7.84 1.804A1 1 0 0 1 8.82 1h2.36a1 1 0 0 1 .98.804l.331 1.652a6.993 6.993 0 0 1 1.929 1.115l1.598-.54a1 1 0 0 1 1.186.447l1.18 2.044a1 1 0 0 1-.205 1.251l-1.267 1.225c.048.385.073.778.073 1.176 0 .399-.025.791-.073 1.176l1.267 1.225a1 1 0 0 1 .206 1.25l-1.18 2.045a1 1 0 0 1-1.187.447l-1.598-.54a6.993 6.993 0 0 1-1.929 1.115l-.33 1.652a1 1 0 0 1-.98.804H8.82a1 1 0 0 1-.98-.804l-.331-1.652a6.993 6.993 0 0 1-1.929-1.115l-1.598.54a1 1 0 0 1-1.186-.447l-1.18-2.044a1 1 0 0 1 .205-1.251l1.267-1.225A7.035 7.035 0 0 1 3.668 10c0-.398.025-.791.073-1.176L2.474 7.6a1 1 0 0 1-.206-1.25L3.448 4.3a1 1 0 0 1 1.187-.447l1.598.54A6.993 6.993 0 0 1 8.162 3.45l.331-1.652ZM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
    </svg>
  </button>

  <!-- 设置弹窗 -->
  <div class="settings-modal-overlay" id="settingsModalOverlay">
    <div class="settings-modal">
      <h2>服务端设置</h2>
      <p class="settings-subtitle">配置后端 API 服务环境，修改后立即生效</p>
      <div class="form-group">
        <label for="envSelect">运行环境</label>
        <select id="envSelect">
          <option value="prod">生产环境</option>
          <option value="uat">测试环境</option>
          <option value="custom">自定义</option>
        </select>
        <div class="custom-url-group" id="customUrlGroup">
          <label for="serverUrlInput" style="font-size: 13px;">服务端 URL</label>
          <input type="text" id="serverUrlInput" placeholder="https://example.com:7443" autocomplete="off" />
          <div class="url-hint">
            请输入完整地址（含 http:// 或 https://），不要加末尾斜杠
          </div>
        </div>
      </div>
      <div class="settings-status" id="settingsStatus"></div>
      <div class="settings-modal-actions">
        <button type="button" class="btn-cancel" id="settingsCancelBtn">取消</button>
        <button type="button" class="btn-save" id="settingsSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="login-card">
    <h1>欢迎登录</h1>
    <p class="subtitle">请输入您的邮箱和密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">邮箱</label>
        <div class="email-wrapper">
          <div class="email-input-row">
            <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="off" />
            <button type="button" class="email-toggle" id="emailToggle" hidden aria-label="选择已保存账号">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 011.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          <div class="accounts-dropdown" id="accountsDropdown"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberPassword" />
        <label for="rememberPassword">记住密码</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="register-link">还没有账号？<a id="registerLink">注册账号</a></div>
    </form>
  </div>

  <!-- 内嵌 webview 注册页 -->
  <div class="register-page" id="registerPage">
    <div class="register-toolbar">
      <button type="button" class="register-back-btn" id="registerBackBtn">← 返回登录</button>
      <div class="toolbar-title">注册账号</div>
    </div>
    <div class="register-container" id="registerContainer">
      <div class="register-loading">正在打开注册页...</div>
    </div>
  </div>

  <script src="js/renderer-logger.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const rememberCb = document.getElementById('rememberPassword');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailToggle = document.getElementById('emailToggle');
    const accountsDropdown = document.getElementById('accountsDropdown');

    // 内存中的已保存账号列表（不含密码）
    let savedAccounts = [];
    let dropdownOpen = false;

    /**
     * 邮箱首字母（用于头像占位符）
     */
    function getEmailInitial(email) {
      if (!email) return '?';
      return email.charAt(0).toUpperCase();
    }

    /**
     * 渲染账号下拉列表
     */
    function renderAccountsDropdown() {
      accountsDropdown.innerHTML = '';
      if (!savedAccounts || savedAccounts.length === 0) {
        emailToggle.hidden = true;
        return;
      }
      emailToggle.hidden = false;

      savedAccounts.forEach((account) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'account-item';

        const avatar = document.createElement('div');
        avatar.className = 'account-avatar';
        if (account.profileAvatar) {
          const img = document.createElement('img');
          img.src = account.profileAvatar;
          img.alt = '';
          img.onerror = () => {
            img.remove();
            avatar.textContent = getEmailInitial(account.email);
          };
          avatar.appendChild(img);
        } else {
          avatar.textContent = getEmailInitial(account.email);
        }

        const info = document.createElement('div');
        info.className = 'account-info';
        const emailDiv = document.createElement('div');
        emailDiv.className = 'account-email';
        emailDiv.textContent = account.email;
        info.appendChild(emailDiv);
        if (account.profileName) {
          const nameDiv = document.createElement('div');
          nameDiv.className = 'account-name';
          nameDiv.textContent = account.profileName;
          info.appendChild(nameDiv);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'account-delete';
        deleteBtn.title = '删除该账号';
        deleteBtn.setAttribute('aria-label', `删除账号 ${account.email}`);
        deleteBtn.innerHTML =
          '<svg viewBox="0 0 20 20" fill="currentColor">' +
          '<path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.298 1.487l.084-.017 1.107 12.18A2.25 2.25 0 007.37 20h5.26a2.25 2.25 0 002.246-1.86l1.107-12.18.084.017a.75.75 0 00.298-1.487A41.04 41.04 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" />' +
          '</svg>';
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation(); // 不触发 item 的填充
          if (!confirm(`确定删除已保存的账号「${account.email}」吗？`)) return;
          if (window.electronAPI && window.electronAPI.accounts) {
            const r = await window.electronAPI.accounts.remove(account.email);
            if (r && r.success) {
              await refreshAccounts();
            }
          }
        });

        item.appendChild(avatar);
        item.appendChild(info);
        item.appendChild(deleteBtn);
        item.addEventListener('click', () => selectAccount(account));
        accountsDropdown.appendChild(item);
      });

      if (savedAccounts.length > 1) {
        const clearAll = document.createElement('button');
        clearAll.type = 'button';
        clearAll.className = 'account-clear-all';
        clearAll.textContent = '清空所有已保存账号';
        clearAll.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('确定清空所有已保存的账号吗？此操作不可恢复。')) return;
          if (window.electronAPI && window.electronAPI.accounts) {
            await window.electronAPI.accounts.clear();
            await refreshAccounts();
          }
        });
        accountsDropdown.appendChild(clearAll);
      }
    }

    /**
     * 选中某个已保存的账号：填充邮箱和密码
     */
    async function selectAccount(account) {
      emailInput.value = account.email;
      passwordInput.value = '';
      passwordInput.placeholder = '正在加载密码...';
      closeDropdown();
      if (window.electronAPI && window.electronAPI.accounts) {
        const r = await window.electronAPI.accounts.getPassword(account.email);
        if (r && r.success && r.password) {
          passwordInput.value = r.password;
        } else {
          // 取不到密码（环境不支持解密）时仅填充邮箱，让用户手动输入
          passwordInput.value = '';
        }
      }
      passwordInput.placeholder = '请输入密码';
      rememberCb.checked = true; // 既然选了历史账号，默认勾选记住
      passwordInput.focus();
    }

    function openDropdown() {
      if (savedAccounts.length === 0) return;
      accountsDropdown.classList.add('show');
      emailToggle.classList.add('active');
      dropdownOpen = true;
    }

    function closeDropdown() {
      accountsDropdown.classList.remove('show');
      emailToggle.classList.remove('active');
      dropdownOpen = false;
    }

    function toggleDropdown() {
      if (dropdownOpen) closeDropdown();
      else openDropdown();
    }

    /**
     * 从主进程拉取账号列表并刷新 UI
     */
    async function refreshAccounts() {
      if (!window.electronAPI || !window.electronAPI.accounts) return;
      try {
        const r = await window.electronAPI.accounts.list();
        if (r && r.success) {
          savedAccounts = r.data || [];
        } else {
          savedAccounts = [];
        }
      } catch (err) {
        savedAccounts = [];
      }
      renderAccountsDropdown();
      if (savedAccounts.length === 0 && dropdownOpen) closeDropdown();
    }

    // 点击下拉箭头
    emailToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    // 点击其他区域关闭下拉
    document.addEventListener('click', (e) => {
      if (!dropdownOpen) return;
      if (accountsDropdown.contains(e.target) || emailToggle.contains(e.target)) return;
      closeDropdown();
    });

    // 页面加载时拉取账号列表
    refreshAccounts();

    // 注册链接：切换到内嵌 webview 注册页
    document.getElementById('registerLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await openRegisterPage();
    });

    // 注册入口仅生产环境开放：其他环境（uat / 自定义）隐藏
    // （非生产后端的注册流程不对外开放，避免脏数据进入测试/生产库）
    async function updateRegisterLinkVisibility() {
      const registerLink = document.querySelector('.register-link');
      if (!registerLink) return;
      let baseUrl = '';
      try {
        if (window.electronAPI && typeof window.electronAPI.getSdkCapabilities === 'function') {
          const capabilities = await window.electronAPI.getSdkCapabilities();
          if (capabilities && capabilities['feature.webView'] !== true) {
            registerLink.style.display = 'none';
            return;
          }
        }
        if (window.electronAPI && window.electronAPI.settings) {
          const r = await window.electronAPI.settings.getServerUrl();
          if (r && r.success && r.baseUrl) baseUrl = r.baseUrl;
        }
      } catch {}
      // detectEnv 定义在服务端设置弹窗区域：prod / uat / custom
      const env = baseUrl ? detectEnv(baseUrl) : 'prod';
      registerLink.style.display = env === 'prod' ? '' : 'none';
    }
    updateRegisterLinkVisibility();

    // 返回登录
    document.getElementById('registerBackBtn').addEventListener('click', async () => {
      await closeRegisterPage();
    });

    // ========== 内嵌 webview 注册页 ==========
    const registerPage = document.getElementById('registerPage');
    const registerContainer = document.getElementById('registerContainer');
    // 注册页 URL 跟随服务端 URL 设置（由 settings.getServerUrl() 返回，登录前动态拉取）
    let REGISTER_URL = '';
    let registerResizeTimer = null;

    function calculateRegisterBounds() {
      const rect = registerContainer.getBoundingClientRect();
      return {
        x: Math.round(rect.left),
        y: Math.round(rect.top),
        width: Math.max(1, Math.round(rect.width)),
        height: Math.max(1, Math.round(rect.height)),
      };
    }

    async function openRegisterPage() {
      if (!window.electronAPI || !window.electronAPI.webviewCreate) {
        // preload 未暴露 webview API：降级为原系统浏览器方案
        window.electronAPI.openExternal(await getRegisterUrl());
        return;
      }
      // 切换显示
      document.body.classList.add('register-mode');
      registerPage.classList.add('active');
      // 等下一帧让容器拿到正确尺寸后再创建 webview
      await new Promise((r) => requestAnimationFrame(r));
      const bounds = calculateRegisterBounds();
      const result = await window.electronAPI.webviewCreate(await getRegisterUrl(), bounds);
      if (!result.success) {
        alert('无法打开注册页: ' + (result.message || '未知错误'));
        await closeRegisterPage();
      }
    }

    // 动态获取注册页 URL（基于当前服务端 URL）
    async function getRegisterUrl() {
      if (REGISTER_URL) return REGISTER_URL;
      try {
        if (window.electronAPI && window.electronAPI.settings) {
          const r = await window.electronAPI.settings.getServerUrl();
          if (r && r.success && r.baseUrl) {
            REGISTER_URL = r.baseUrl + '/user-center/register';
            return REGISTER_URL;
          }
        }
      } catch {}
      REGISTER_URL = 'https://wemeetsdkdemo-prod.liuqi92.cn:7443/user-center/register';
      return REGISTER_URL;
    }

    async function closeRegisterPage() {
      if (window.electronAPI && window.electronAPI.webviewClose) {
        await window.electronAPI.webviewClose();
      }
      registerPage.classList.remove('active');
      document.body.classList.remove('register-mode');
    }

    // 窗口 resize 时同步 webview 大小
    window.addEventListener('resize', () => {
      if (!registerPage.classList.contains('active')) return;
      clearTimeout(registerResizeTimer);
      registerResizeTimer = setTimeout(async () => {
        if (window.electronAPI && window.electronAPI.webviewResize) {
          await window.electronAPI.webviewResize(calculateRegisterBounds());
        }
      }, 100);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMsg.textContent = '';

      if (!email || !password) {
        errorMsg.textContent = '请输入邮箱和密码';
        return;
      }

      // 邮箱格式校验
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMsg.textContent = '请输入有效的邮箱地址';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const result = await window.electronAPI.login(email, password);

        if (result.success) {
          // 多账号记住密码：勾选则加密保存，未勾选则不主动删除
          // （即使用户取消勾选，也保留历史账号方便下次切换）
          if (rememberCb.checked && window.electronAPI.accounts) {
            const profile = (result && result.profile) || {};
            await window.electronAPI.accounts.save(email, password, {
              name: profile.nickname || profile.name || '',
              avatar: profile.avatar || profile.avatar_url || '',
            });
          }
          window.electronAPI.loginSuccess();
        } else {
          errorMsg.textContent = result.message || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查连接后重试';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });

    // ========== 服务端设置弹窗 ==========
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModalOverlay = document.getElementById('settingsModalOverlay');
    const envSelect = document.getElementById('envSelect');
    const customUrlGroup = document.getElementById('customUrlGroup');
    const serverUrlInput = document.getElementById('serverUrlInput');
    const settingsStatus = document.getElementById('settingsStatus');
    const settingsSaveBtn = document.getElementById('settingsSaveBtn');
    const settingsCancelBtn = document.getElementById('settingsCancelBtn');

    // 预置环境 URL 映射
    const ENV_URLS = {
      prod: 'https://wemeetsdkdemo-prod.liuqi92.cn:7443',
      uat: 'https://wemeetsdkdemo-uat.liuqi92.cn:7443',
    };

    // 根据当前 baseUrl 判断所属环境
    function detectEnv(baseUrl) {
      if (!baseUrl) return 'prod';
      for (const [env, url] of Object.entries(ENV_URLS)) {
        if (baseUrl === url) return env;
      }
      return 'custom';
    }

    // 切换环境选项时更新输入框显示
    function onEnvChange() {
      const env = envSelect.value;
      if (env === 'custom') {
        customUrlGroup.classList.add('show');
        setTimeout(() => serverUrlInput.focus(), 50);
      } else {
        customUrlGroup.classList.remove('show');
      }
      settingsStatus.textContent = '';
      settingsStatus.className = 'settings-status';
    }

    envSelect.addEventListener('change', onEnvChange);

    async function openSettingsModal() {
      settingsStatus.textContent = '';
      settingsStatus.className = 'settings-status';
      serverUrlInput.value = '';
      settingsModalOverlay.classList.add('show');
      // 拉取当前服务端 URL，判断所属环境
      try {
        if (window.electronAPI && window.electronAPI.settings) {
          const r = await window.electronAPI.settings.getServerUrl();
          if (r && r.success && r.baseUrl) {
            const env = detectEnv(r.baseUrl);
            envSelect.value = env;
            if (env === 'custom') {
              serverUrlInput.value = r.baseUrl;
            }
            onEnvChange();
          }
        }
      } catch (err) {
        settingsStatus.textContent = '获取当前设置失败';
        settingsStatus.className = 'settings-status error';
      }
    }

    function closeSettingsModal() {
      settingsModalOverlay.classList.remove('show');
    }

    settingsBtn.addEventListener('click', openSettingsModal);
    settingsCancelBtn.addEventListener('click', closeSettingsModal);

    // 点击遮罩关闭
    settingsModalOverlay.addEventListener('click', (e) => {
      if (e.target === settingsModalOverlay) closeSettingsModal();
    });

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && settingsModalOverlay.classList.contains('show')) {
        closeSettingsModal();
      }
    });

    // 自定义输入框回车保存
    serverUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') settingsSaveBtn.click();
    });

    // 保存
    settingsSaveBtn.addEventListener('click', async () => {
      const env = envSelect.value;
      let url;
      if (env === 'custom') {
        url = serverUrlInput.value.trim();
        if (!url) {
          settingsStatus.textContent = 'URL 不能为空';
          settingsStatus.className = 'settings-status error';
          return;
        }
      } else {
        url = ENV_URLS[env];
      }
      settingsSaveBtn.disabled = true;
      settingsStatus.textContent = '保存中...';
      settingsStatus.className = 'settings-status';
      try {
        const r = await window.electronAPI.settings.setServerUrl(url);
        if (r.success) {
          settingsStatus.textContent = '保存成功，已生效';
          settingsStatus.className = 'settings-status success';
          // 清空注册页 URL 缓存，下次打开重新拉取
          REGISTER_URL = '';
          // 同步注册入口显隐（仅生产环境显示）
          updateRegisterLinkVisibility();
          setTimeout(closeSettingsModal, 800);
        } else {
          settingsStatus.textContent = r.message || '保存失败';
          settingsStatus.className = 'settings-status error';
        }
      } catch (err) {
        settingsStatus.textContent = '保存失败: ' + err.message;
        settingsStatus.className = 'settings-status error';
      } finally {
        settingsSaveBtn.disabled = false;
      }
    });
        </script>
</body>
</html>
