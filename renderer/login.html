<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议SDK Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.92;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .remember-row label {
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    /* ========== 多账号下拉选择 ========== */
    .email-wrapper {
      position: relative;
    }

    .email-input-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .email-input-row input {
      flex: 1;
      min-width: 0;
    }

    .email-toggle {
      flex-shrink: 0;
      padding: 0 12px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .email-toggle:hover {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    .email-toggle.active {
      background: #eef2ff;
      border-color: #667eea;
    }

    .email-toggle[hidden] {
      display: none;
    }

    .email-toggle svg {
      width: 16px;
      height: 16px;
      color: #6b7280;
      transition: transform 0.2s;
    }

    .email-toggle.active svg {
      transform: rotate(180deg);
      color: #667eea;
    }

    .accounts-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .accounts-dropdown.show {
      display: block;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.12s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .account-item:hover {
      background: #f3f4f6;
    }

    .account-item + .account-item {
      border-top: 1px solid #f3f4f6;
    }

    .account-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
    }

    .account-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-info {
      flex: 1;
      min-width: 0;
    }

    .account-email {
      font-size: 14px;
      color: #1a1a2e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-name {
      font-size: 12px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-delete {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: #9ca3af;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .account-delete:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .account-delete svg {
      width: 14px;
      height: 14px;
    }

    .account-clear-all {
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: #f9fafb;
      color: #6b7280;
      font-size: 12px;
      cursor: pointer;
      border-top: 1px solid #e5e7eb;
      transition: background 0.12s, color 0.12s;
      font-family: inherit;
    }

    .account-clear-all:hover {
      background: #f3f4f6;
      color: #ef4444;
    }

    /* ========== 注册页（内嵌 webview） ========== */
    .register-page {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .register-page.active {
      display: flex;
    }

    .register-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: #f5f5f7;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
      -webkit-app-region: drag; /* 允许拖动窗口 */
    }

    .register-toolbar button {
      -webkit-app-region: no-drag;
    }

    .register-toolbar .toolbar-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .register-back-btn {
      padding: 6px 14px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .register-back-btn:hover {
      background: #f3f4f6;
    }

    .register-container {
      flex: 1;
      position: relative;
      background: #fff;
      /* WebContentsView 会精确覆盖此区域 */
    }

    .register-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 13px;
      gap: 10px;
      pointer-events: none;
    }

    .register-loading::before {
      content: '';
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 注册页激活时隐藏登录卡 */
    body.register-mode .login-card {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>欢迎登录</h1>
    <p class="subtitle">请输入您的邮箱和密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">邮箱</label>
        <div class="email-wrapper">
          <div class="email-input-row">
            <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="off" />
            <button type="button" class="email-toggle" id="emailToggle" hidden aria-label="选择已保存账号">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 011.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          <div class="accounts-dropdown" id="accountsDropdown"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberPassword" />
        <label for="rememberPassword">记住密码</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="register-link">还没有账号？<a id="registerLink">注册账号</a></div>
    </form>
  </div>

  <!-- 内嵌 webview 注册页 -->
  <div class="register-page" id="registerPage">
    <div class="register-toolbar">
      <button type="button" class="register-back-btn" id="registerBackBtn">← 返回登录</button>
      <div class="toolbar-title">注册账号</div>
    </div>
    <div class="register-container" id="registerContainer">
      <div class="register-loading">正在打开注册页...</div>
    </div>
  </div>

  <script src="js/renderer-logger.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const rememberCb = document.getElementById('rememberPassword');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailToggle = document.getElementById('emailToggle');
    const accountsDropdown = document.getElementById('accountsDropdown');

    // 内存中的已保存账号列表（不含密码）
    let savedAccounts = [];
    let dropdownOpen = false;

    /**
     * 邮箱首字母（用于头像占位符）
     */
    function getEmailInitial(email) {
      if (!email) return '?';
      return email.charAt(0).toUpperCase();
    }

    /**
     * 渲染账号下拉列表
     */
    function renderAccountsDropdown() {
      accountsDropdown.innerHTML = '';
      if (!savedAccounts || savedAccounts.length === 0) {
        emailToggle.hidden = true;
        return;
      }
      emailToggle.hidden = false;

      savedAccounts.forEach((account) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'account-item';

        const avatar = document.createElement('div');
        avatar.className = 'account-avatar';
        if (account.profileAvatar) {
          const img = document.createElement('img');
          img.src = account.profileAvatar;
          img.alt = '';
          img.onerror = () => {
            img.remove();
            avatar.textContent = getEmailInitial(account.email);
          };
          avatar.appendChild(img);
        } else {
          avatar.textContent = getEmailInitial(account.email);
        }

        const info = document.createElement('div');
        info.className = 'account-info';
        const emailDiv = document.createElement('div');
        emailDiv.className = 'account-email';
        emailDiv.textContent = account.email;
        info.appendChild(emailDiv);
        if (account.profileName) {
          const nameDiv = document.createElement('div');
          nameDiv.className = 'account-name';
          nameDiv.textContent = account.profileName;
          info.appendChild(nameDiv);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'account-delete';
        deleteBtn.title = '删除该账号';
        deleteBtn.setAttribute('aria-label', `删除账号 ${account.email}`);
        deleteBtn.innerHTML =
          '<svg viewBox="0 0 20 20" fill="currentColor">' +
          '<path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.298 1.487l.084-.017 1.107 12.18A2.25 2.25 0 007.37 20h5.26a2.25 2.25 0 002.246-1.86l1.107-12.18.084.017a.75.75 0 00.298-1.487A41.04 41.04 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" />' +
          '</svg>';
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation(); // 不触发 item 的填充
          if (!confirm(`确定删除已保存的账号「${account.email}」吗？`)) return;
          if (window.electronAPI && window.electronAPI.accounts) {
            const r = await window.electronAPI.accounts.remove(account.email);
            if (r && r.success) {
              await refreshAccounts();
            }
          }
        });

        item.appendChild(avatar);
        item.appendChild(info);
        item.appendChild(deleteBtn);
        item.addEventListener('click', () => selectAccount(account));
        accountsDropdown.appendChild(item);
      });

      if (savedAccounts.length > 1) {
        const clearAll = document.createElement('button');
        clearAll.type = 'button';
        clearAll.className = 'account-clear-all';
        clearAll.textContent = '清空所有已保存账号';
        clearAll.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('确定清空所有已保存的账号吗？此操作不可恢复。')) return;
          if (window.electronAPI && window.electronAPI.accounts) {
            await window.electronAPI.accounts.clear();
            await refreshAccounts();
          }
        });
        accountsDropdown.appendChild(clearAll);
      }
    }

    /**
     * 选中某个已保存的账号：填充邮箱和密码
     */
    async function selectAccount(account) {
      emailInput.value = account.email;
      passwordInput.value = '';
      passwordInput.placeholder = '正在加载密码...';
      closeDropdown();
      if (window.electronAPI && window.electronAPI.accounts) {
        const r = await window.electronAPI.accounts.getPassword(account.email);
        if (r && r.success && r.password) {
          passwordInput.value = r.password;
        } else {
          // 取不到密码（环境不支持解密）时仅填充邮箱，让用户手动输入
          passwordInput.value = '';
        }
      }
      passwordInput.placeholder = '请输入密码';
      rememberCb.checked = true; // 既然选了历史账号，默认勾选记住
      passwordInput.focus();
    }

    function openDropdown() {
      if (savedAccounts.length === 0) return;
      accountsDropdown.classList.add('show');
      emailToggle.classList.add('active');
      dropdownOpen = true;
    }

    function closeDropdown() {
      accountsDropdown.classList.remove('show');
      emailToggle.classList.remove('active');
      dropdownOpen = false;
    }

    function toggleDropdown() {
      if (dropdownOpen) closeDropdown();
      else openDropdown();
    }

    /**
     * 从主进程拉取账号列表并刷新 UI
     */
    async function refreshAccounts() {
      if (!window.electronAPI || !window.electronAPI.accounts) return;
      try {
        const r = await window.electronAPI.accounts.list();
        if (r && r.success) {
          savedAccounts = r.data || [];
        } else {
          savedAccounts = [];
        }
      } catch (err) {
        savedAccounts = [];
      }
      renderAccountsDropdown();
      if (savedAccounts.length === 0 && dropdownOpen) closeDropdown();
    }

    // 点击下拉箭头
    emailToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    // 点击其他区域关闭下拉
    document.addEventListener('click', (e) => {
      if (!dropdownOpen) return;
      if (accountsDropdown.contains(e.target) || emailToggle.contains(e.target)) return;
      closeDropdown();
    });

    // 页面加载时拉取账号列表
    refreshAccounts();

    // 注册链接：切换到内嵌 webview 注册页
    document.getElementById('registerLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await openRegisterPage();
    });

    // 返回登录
    document.getElementById('registerBackBtn').addEventListener('click', async () => {
      await closeRegisterPage();
    });

    // ========== 内嵌 webview 注册页 ==========
    const registerPage = document.getElementById('registerPage');
    const registerContainer = document.getElementById('registerContainer');
    const REGISTER_URL = 'https://wemeetapp.liuqi92.cn/user-center/register';
    let registerResizeTimer = null;

    function calculateRegisterBounds() {
      const rect = registerContainer.getBoundingClientRect();
      return {
        x: Math.round(rect.left),
        y: Math.round(rect.top),
        width: Math.max(1, Math.round(rect.width)),
        height: Math.max(1, Math.round(rect.height)),
      };
    }

    async function openRegisterPage() {
      if (!window.electronAPI || !window.electronAPI.webviewCreate) {
        // preload 未暴露 webview API：降级为原系统浏览器方案
        window.electronAPI.openExternal(REGISTER_URL);
        return;
      }
      // 切换显示
      document.body.classList.add('register-mode');
      registerPage.classList.add('active');
      // 等下一帧让容器拿到正确尺寸后再创建 webview
      await new Promise((r) => requestAnimationFrame(r));
      const bounds = calculateRegisterBounds();
      const result = await window.electronAPI.webviewCreate(REGISTER_URL, bounds);
      if (!result.success) {
        alert('无法打开注册页: ' + (result.message || '未知错误'));
        await closeRegisterPage();
      }
    }

    async function closeRegisterPage() {
      if (window.electronAPI && window.electronAPI.webviewClose) {
        await window.electronAPI.webviewClose();
      }
      registerPage.classList.remove('active');
      document.body.classList.remove('register-mode');
    }

    // 窗口 resize 时同步 webview 大小
    window.addEventListener('resize', () => {
      if (!registerPage.classList.contains('active')) return;
      clearTimeout(registerResizeTimer);
      registerResizeTimer = setTimeout(async () => {
        if (window.electronAPI && window.electronAPI.webviewResize) {
          await window.electronAPI.webviewResize(calculateRegisterBounds());
        }
      }, 100);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMsg.textContent = '';

      if (!email || !password) {
        errorMsg.textContent = '请输入邮箱和密码';
        return;
      }

      // 邮箱格式校验
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMsg.textContent = '请输入有效的邮箱地址';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const result = await window.electronAPI.login(email, password);

        if (result.success) {
          // 多账号记住密码：勾选则加密保存，未勾选则不主动删除
          // （即使用户取消勾选，也保留历史账号方便下次切换）
          if (rememberCb.checked && window.electronAPI.accounts) {
            const profile = (result && result.profile) || {};
            await window.electronAPI.accounts.save(email, password, {
              name: profile.nickname || profile.name || '',
              avatar: profile.avatar || profile.avatar_url || '',
            });
          }
          window.electronAPI.loginSuccess();
        } else {
          errorMsg.textContent = result.message || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查连接后重试';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
