<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议SDK Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.92;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .remember-row label {
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    /* ========== 注册页（内嵌 webview） ========== */
    .register-page {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .register-page.active {
      display: flex;
    }

    .register-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: #f5f5f7;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
      -webkit-app-region: drag; /* 允许拖动窗口 */
    }

    .register-toolbar button {
      -webkit-app-region: no-drag;
    }

    .register-toolbar .toolbar-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .register-back-btn {
      padding: 6px 14px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .register-back-btn:hover {
      background: #f3f4f6;
    }

    .register-container {
      flex: 1;
      position: relative;
      background: #fff;
      /* WebContentsView 会精确覆盖此区域 */
    }

    .register-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 13px;
      gap: 10px;
      pointer-events: none;
    }

    .register-loading::before {
      content: '';
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 注册页激活时隐藏登录卡 */
    body.register-mode .login-card {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>欢迎登录</h1>
    <p class="subtitle">请输入您的邮箱和密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="请输入邮箱地址" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberPassword" />
        <label for="rememberPassword">记住密码</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="register-link">还没有账号？<a id="registerLink">注册账号</a></div>
    </form>
  </div>

  <!-- 内嵌 webview 注册页 -->
  <div class="register-page" id="registerPage">
    <div class="register-toolbar">
      <button type="button" class="register-back-btn" id="registerBackBtn">← 返回登录</button>
      <div class="toolbar-title">注册账号</div>
    </div>
    <div class="register-container" id="registerContainer">
      <div class="register-loading">正在打开注册页...</div>
    </div>
  </div>

  <script src="js/renderer-logger.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const rememberCb = document.getElementById('rememberPassword');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // 读取记住的邮箱密码
    const savedEmail = localStorage.getItem('remembered_email');
    const savedPassword = localStorage.getItem('remembered_password');
    if (savedEmail) {
      emailInput.value = savedEmail;
      passwordInput.value = savedPassword || '';
      rememberCb.checked = true;
    }

    // 注册链接：切换到内嵌 webview 注册页
    document.getElementById('registerLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await openRegisterPage();
    });

    // 返回登录
    document.getElementById('registerBackBtn').addEventListener('click', async () => {
      await closeRegisterPage();
    });

    // ========== 内嵌 webview 注册页 ==========
    const registerPage = document.getElementById('registerPage');
    const registerContainer = document.getElementById('registerContainer');
    const REGISTER_URL = 'https://wemeetapp.liuqi92.cn/user-center/register';
    let registerResizeTimer = null;

    function calculateRegisterBounds() {
      const rect = registerContainer.getBoundingClientRect();
      return {
        x: Math.round(rect.left),
        y: Math.round(rect.top),
        width: Math.max(1, Math.round(rect.width)),
        height: Math.max(1, Math.round(rect.height)),
      };
    }

    async function openRegisterPage() {
      if (!window.electronAPI || !window.electronAPI.webviewCreate) {
        // preload 未暴露 webview API：降级为原系统浏览器方案
        window.electronAPI.openExternal(REGISTER_URL);
        return;
      }
      // 切换显示
      document.body.classList.add('register-mode');
      registerPage.classList.add('active');
      // 等下一帧让容器拿到正确尺寸后再创建 webview
      await new Promise((r) => requestAnimationFrame(r));
      const bounds = calculateRegisterBounds();
      const result = await window.electronAPI.webviewCreate(REGISTER_URL, bounds);
      if (!result.success) {
        alert('无法打开注册页: ' + (result.message || '未知错误'));
        await closeRegisterPage();
      }
    }

    async function closeRegisterPage() {
      if (window.electronAPI && window.electronAPI.webviewClose) {
        await window.electronAPI.webviewClose();
      }
      registerPage.classList.remove('active');
      document.body.classList.remove('register-mode');
    }

    // 窗口 resize 时同步 webview 大小
    window.addEventListener('resize', () => {
      if (!registerPage.classList.contains('active')) return;
      clearTimeout(registerResizeTimer);
      registerResizeTimer = setTimeout(async () => {
        if (window.electronAPI && window.electronAPI.webviewResize) {
          await window.electronAPI.webviewResize(calculateRegisterBounds());
        }
      }, 100);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMsg.textContent = '';

      if (!email || !password) {
        errorMsg.textContent = '请输入邮箱和密码';
        return;
      }

      // 邮箱格式校验
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMsg.textContent = '请输入有效的邮箱地址';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const result = await window.electronAPI.login(email, password);

        if (result.success) {
          // 记住密码逻辑
          if (rememberCb.checked) {
            localStorage.setItem('remembered_email', email);
            localStorage.setItem('remembered_password', password);
          } else {
            localStorage.removeItem('remembered_email');
            localStorage.removeItem('remembered_password');
          }
          window.electronAPI.loginSuccess();
        } else {
          errorMsg.textContent = result.message || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查连接后重试';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
