<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议SDK Demo</title>
  <link rel="stylesheet" href="css/meeting.css" />
  <link rel="stylesheet" href="css/contacts.css" />
  <link rel="stylesheet" href="css/im.css" />
</head>
<body>
  <!-- 左侧窄导航 -->
  <nav class="side-nav">
    <div class="nav-avatar" id="userAvatarNav">?</div>

    <div class="nav-item active" data-tab="im" title="消息">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      <span class="nav-badge" id="imNavBadge" style="display:none;"></span>
    </div>

    <div class="nav-item" data-tab="contacts" title="通讯录">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>

    <div class="nav-item" data-tab="meeting" title="会议">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </div>
  </nav>

  <!-- SDK 加载中状态 -->
  <div class="sdk-loading" id="sdkLoading">
    <div class="spinner"></div>
    <div class="loading-text">会议功能加载中...</div>
  </div>

  <!-- 左侧面板 -->
  <aside class="left-panel" id="leftPanel" style="display:none;">
    <div class="action-grid">
      <button class="action-btn" id="btnJoin">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        <span class="label">加入会议</span>
      </button>

      <button class="action-btn" id="btnQuick">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>
        <span class="label">快速会议</span>
      </button>

      <button class="action-btn" id="btnSchedule">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <span class="label">预定会议</span>
      </button>

      <button class="action-btn" id="btnScreen">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        </div>
        <span class="label">共享屏幕</span>
      </button>
    </div>

  </aside>

  <!-- 右侧内容 -->
  <main class="right-content" id="rightContent" style="display:none;">
    <div class="meeting-list-header">
      <h2>待参加的会议</h2>
      <button class="refresh-btn" id="refreshMeetings" title="刷新">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    <div class="meeting-list" id="meetingList">
      <!-- 动态渲染 -->
    </div>
  </main>

  <!-- 通讯录页面 -->
  <div class="contacts-page" id="contactsPage" style="display:none;">
    <div class="contacts-left-panel">
      <div class="contacts-search-box">
        <svg viewBox="0 0 24 24" class="search-icon"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="contactsSearchInput" placeholder="搜索姓名或用户ID" />
      </div>
      <div class="contacts-search-results" id="contactsSearchResults" style="display:none;">
        <!-- 搜索结果动态渲染 -->
      </div>
      <div class="contacts-dept-tree" id="contactsDeptTree">
        <!-- 部门树动态渲染 -->
      </div>
    </div>
    <div class="contacts-right-panel">
      <div class="contacts-user-list-header" id="contactsUserListHeader">
        <h2>通讯录</h2>
      </div>
      <div class="contacts-user-list" id="contactsUserList">
        <!-- 用户列表动态渲染 -->
      </div>
    </div>
  </div>

  <!-- IM 即时通讯页面 -->
  <div class="im-page" id="imPage" style="display:none;">
    <!-- 会话列表 -->
    <div class="im-sidebar">
      <div class="im-sidebar-header">
        <button class="im-new-chat-btn" id="imNewChatBtn" title="发起会话">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <div class="im-search-box">
          <svg viewBox="0 0 24 24" class="search-icon"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="imConvSearchInput" placeholder="搜索会话" />
        </div>
      </div>
      <div class="im-conversation-list" id="imConversationList">
        <!-- 会话列表动态渲染 -->
      </div>
    </div>

    <!-- 聊天窗口 -->
    <div class="im-chat" id="imChatWrapper">
      <!-- 空状态 -->
      <div class="im-empty-chat" id="imChatEmpty">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <div>选择一个会话开始聊天</div>
      </div>

      <!-- 聊天内容 -->
      <div id="imChatContent" style="display:none;">
        <div class="im-chat-header" id="imChatHeader">
          <!-- 动态渲染 -->
        </div>
        <div class="im-messages-container" id="imMessagesContainer">
          <!-- 消息动态渲染 -->
        </div>
        <div class="im-typing-indicator" id="imTypingIndicator"></div>
        <div class="im-input-area">
          <div class="im-input-toolbar">
            <button class="im-tool-btn" id="imImageBtn" title="发送图片">
              <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button class="im-tool-btn" id="imFileBtn" title="发送文件">
              <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
            </button>
            <div class="im-ws-status connecting" id="imWsStatus" title="连接状态"></div>
          </div>
          <div class="im-input-row">
            <textarea id="imMessageInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button class="im-send-btn" id="imSendBtn" disabled>发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 文件输入（隐藏） -->
  <input type="file" class="im-file-input" id="imImageInput" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" />
  <input type="file" class="im-file-input" id="imFileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.txt,.csv,.json,.mp4,.mov,.mp3,.m4a" />

  <!-- 新建会话弹窗 -->
  <div class="modal-overlay im-new-chat-modal" id="imNewChatModal">
    <div class="modal-card">
      <h2>发起会话</h2>
      <p class="modal-desc">选择用户发起单聊或群聊</p>
      <div class="im-chat-type-tabs">
        <div class="im-chat-type-tab active" data-type="single">单聊</div>
        <div class="im-chat-type-tab" data-type="group">群聊</div>
      </div>
      <div id="imNewChatGroupNameRow" style="display:none;">
        <input type="text" class="im-group-name-input" id="imNewChatGroupName" placeholder="请输入群聊名称（≤64字符）" maxlength="64" />
      </div>
      <div class="contacts-search-box" style="margin-bottom:10px;position:relative;">
        <svg viewBox="0 0 24 24" class="search-icon" style="width:16px;height:16px;fill:#bbb;position:absolute;left:10px;top:50%;transform:translateY(-50%);"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="imNewChatSearchInput" placeholder="搜索用户名或邮箱" style="padding:7px 10px 7px 30px;border:1px solid #d9d9d9;border-radius:8px;font-size:13px;width:100%;outline:none;background:#f5f5f5;" />
      </div>
      <div class="im-user-search-results" id="imNewChatSearchResults">
        <div style="padding:20px;text-align:center;color:#bbb;font-size:13px;">输入关键词搜索用户</div>
      </div>
      <div id="imNewChatSelectedUsers" style="margin-bottom:14px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="imNewChatCancel">取消</button>
        <button class="btn-submit" id="imNewChatSubmit">创建会话</button>
      </div>
      <div class="modal-error" id="imNewChatError"></div>
    </div>
  </div>

  <!-- 成员列表弹窗 -->
  <div class="modal-overlay im-members-modal" id="imMembersModal">
    <div class="modal-card">
      <h2 id="imMembersTitle">群成员</h2>
      <p class="modal-desc">群聊成员列表</p>
      <div id="imMembersList" style="max-height:400px;overflow-y:auto;">
        <!-- 成员列表动态渲染 -->
      </div>
      <div class="modal-actions">
        <button class="btn-submit" id="imMembersClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 图片预览 -->
  <div class="im-image-preview-overlay" id="imImagePreviewOverlay">
    <img id="imImagePreviewImg" src="" alt="图片预览" />
  </div>

  <!-- 头像下拉菜单 -->
  <div class="avatar-menu" id="avatarMenu">
    <div class="avatar-menu-item" id="changePasswordMenu">修改密码</div>
    <div class="avatar-menu-item" id="uploadLogsMenu">上传腾讯会议日志</div>
    <div class="avatar-menu-divider"></div>
    <div class="avatar-menu-item danger" id="logoutMenu">退出登录</div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal-card">
      <h2>修改密码</h2>
      <p class="modal-desc">修改成功后其他设备需要重新登录</p>
      <div class="form-group">
        <label for="oldPassword">当前密码</label>
        <input type="password" id="oldPassword" placeholder="请输入当前密码" />
      </div>
      <div class="form-group">
        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" placeholder="请输入新密码" />
        <div class="password-hint">需 ≥8 位，含大写字母、小写字母和数字</div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">确认新密码</label>
        <input type="password" id="confirmPassword" placeholder="请再次输入新密码" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelChangePassword">取消</button>
        <button class="btn-submit" id="submitChangePassword">确认修改</button>
      </div>
      <div class="modal-error" id="changePasswordError"></div>
      <div class="modal-success" id="changePasswordSuccess"></div>
    </div>
  </div>

  <!-- 预定会议弹窗 -->
  <div class="modal-overlay schedule-modal" id="scheduleMeetingModal">
    <div class="modal-card">
      <div id="scheduleFormContainer">
        <h2>预定会议</h2>
        <p class="modal-desc">填写会议信息后提交创建</p>
        <div class="schedule-form">
          <div class="form-row">
            <label>会议主题<span class="required">*</span></label>
            <input type="text" id="meetingSubject" placeholder="请输入会议主题" maxlength="100" />
          </div>
          <div class="time-row">
            <div class="form-row">
              <label>开始时间<span class="required">*</span></label>
              <input type="datetime-local" id="meetingStartTime" />
            </div>
            <div class="form-row">
              <label>结束时间<span class="required">*</span></label>
              <input type="datetime-local" id="meetingEndTime" />
            </div>
          </div>
          <div class="form-row">
            <label>会议密码</label>
            <input type="text" id="meetingPassword" placeholder="留空则无密码" maxlength="6" />
            <div class="form-hint">4-6 位数字</div>
          </div>
          <div class="form-row">
            <label>入会静音</label>
            <select id="meetingMuteBeforeJoin">
              <option value="2" selected>超6人自动开启</option>
              <option value="1">开启</option>
              <option value="0">关闭</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="cancelScheduleMeeting">取消</button>
          <button class="btn-submit" id="submitScheduleMeeting">预定会议</button>
        </div>
        <div class="modal-error" id="scheduleMeetingError"></div>
      </div>
      <div id="scheduleResultContainer" style="display:none;">
      </div>
    </div>
  </div>

  <script src="js/contacts.js"></script>
  <script src="js/im-cache.js"></script>
  <script src="js/im.js"></script>
  <script src="js/meeting.js"></script>
</body>
</html>
