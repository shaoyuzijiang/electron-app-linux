<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腾讯会议</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      background: #f5f5f5;
      color: #1e1e1e;
      display: flex;
      overflow: hidden;
    }

    /* 左侧窄导航 */
    .side-nav {
      width: 64px;
      background: #e8e8e8;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      flex-shrink: 0;
    }

    .nav-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 24px;
      position: relative;
    }

    .nav-item {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
      position: relative;
    }

    .nav-item:hover {
      background: #dcdcdc;
    }

    .nav-item.active {
      background: #dcdcdc;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: #999;
    }

    .nav-item.active svg {
      fill: #333;
    }

    /* 左侧面板 */
    .left-panel {
      width: 320px;
      background: #f0f0f0;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      padding: 32px 28px;
      flex-shrink: 0;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .action-btn {
      background: #1e6fff;
      border: none;
      border-radius: 16px;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      color: #fff;
    }

    .action-btn:hover {
      background: #2870ff;
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .action-btn .icon-wrap {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .action-btn .icon-wrap svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    .action-btn .label {
      font-size: 14px;
      font-weight: 500;
    }

    .action-btn .sub-label {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* 右侧内容区 */
    .right-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    /* 会议列表 */
    .meeting-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 32px 32px;
    }

    .meeting-list::-webkit-scrollbar {
      width: 6px;
    }

    .meeting-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .meeting-list::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .date-group {
      margin-bottom: 24px;
    }

    .date-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 12px;
      padding-top: 8px;
    }

    .meeting-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
      margin: 0 -8px;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 8px;
      border-bottom: none;
    }

    .meeting-item:hover {
      background: #f5f5f5;
    }

    .meeting-title {
      font-size: 15px;
      font-weight: 500;
      color: #1e1e1e;
      margin-bottom: 6px;
    }

    .meeting-meta {
      font-size: 13px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meeting-meta .dot {
      width: 3px;
      height: 3px;
      background: #ccc;
      border-radius: 50%;
    }

    .meeting-tag {
      font-size: 12px;
      color: #999;
      margin-left: 4px;
    }

    /* 头像下拉菜单 */
    .avatar-menu {
      position: absolute;
      top: 44px;
      left: 0;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid #e8e8e8;
      min-width: 160px;
      padding: 6px 0;
      z-index: 100;
      display: none;
    }

    .avatar-menu.show {
      display: block;
    }

    .avatar-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .avatar-menu-item:hover {
      background: #f0f0f0;
    }

    .avatar-menu-item.danger {
      color: #ff4d4f;
    }

    .avatar-menu-divider {
      height: 1px;
      background: #eee;
      margin: 4px 0;
    }

    /* 修改密码弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 14px;
      padding: 36px 32px 28px;
      width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border: 1px solid #e8e8e8;
    }

    .modal-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1e1e1e;
      margin-bottom: 6px;
    }

    .modal-card .modal-desc {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
    }

    .modal-card .form-group {
      margin-bottom: 18px;
    }

    .modal-card .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }

    .modal-card .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
      color: #1e1e1e;
    }

    .modal-card .form-group input:focus {
      border-color: #1e6fff;
      box-shadow: 0 0 0 3px rgba(30, 111, 255, 0.15);
    }

    .modal-card .password-hint {
      font-size: 12px;
      color: #bbb;
      margin-top: 4px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .modal-actions .btn-cancel {
      padding: 9px 20px;
      font-size: 14px;
      color: #666;
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-actions .btn-cancel:hover {
      background: #eee;
    }

    .modal-actions .btn-submit {
      padding: 9px 24px;
      font-size: 14px;
      color: #fff;
      background: #1e6fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .modal-actions .btn-submit:hover {
      opacity: 0.92;
    }

    .modal-actions .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .modal-error {
      color: #ff4d4f;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }

    .modal-success {
      color: #52c41a;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }

  </style>
</head>
<body>
  <!-- 左侧窄导航 -->
  <nav class="side-nav">
    <div class="nav-avatar" id="userAvatarNav">?</div>

    <div class="nav-item active" title="会议">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </div>
  </nav>

  <!-- 左侧面板 -->
  <aside class="left-panel">
    <div class="action-grid">
      <button class="action-btn" id="btnJoin">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        <span class="label">加入会议</span>
      </button>

      <button class="action-btn" id="btnQuick">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>
        <span class="label">快速会议</span>
      </button>

      <button class="action-btn" id="btnSchedule">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <span class="label">预定会议</span>
      </button>

      <button class="action-btn" id="btnScreen">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        </div>
        <span class="label">共享屏幕</span>
      </button>
    </div>

  </aside>

  <!-- 右侧内容 -->
  <main class="right-content">
    <div class="meeting-list" id="meetingList">
      <!-- 动态渲染 -->
    </div>
  </main>

  <!-- 头像下拉菜单 -->
  <div class="avatar-menu" id="avatarMenu">
    <div class="avatar-menu-item" id="changePasswordMenu">修改密码</div>
    <div class="avatar-menu-divider"></div>
    <div class="avatar-menu-item danger" id="logoutMenu">退出登录</div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal-card">
      <h2>修改密码</h2>
      <p class="modal-desc">修改成功后其他设备需要重新登录</p>
      <div class="form-group">
        <label for="oldPassword">当前密码</label>
        <input type="password" id="oldPassword" placeholder="请输入当前密码" />
      </div>
      <div class="form-group">
        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" placeholder="请输入新密码" />
        <div class="password-hint">需 ≥8 位，含大写字母、小写字母和数字</div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">确认新密码</label>
        <input type="password" id="confirmPassword" placeholder="请再次输入新密码" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelChangePassword">取消</button>
        <button class="btn-submit" id="submitChangePassword">确认修改</button>
      </div>
      <div class="modal-error" id="changePasswordError"></div>
      <div class="modal-success" id="changePasswordSuccess"></div>
    </div>
  </div>

  <script>
    // 用户信息
    async function loadProfile() {
      try {
        const result = await window.electronAPI.getProfile();
        if (result.success) {
          const { username } = result.profile;
          document.getElementById('userAvatarNav').textContent = username.charAt(0).toUpperCase();
        }
      } catch (err) {
        console.error('获取用户信息失败:', err);
      }
    }

    // 模拟会议数据
    const mockMeetings = [
      {
        date: '今天',
        items: [
          { title: '交付作业平台 - 腾讯会议方案沟通', time: '17:30-18:30', code: '394 928 762', tag: '' }
        ]
      },
      {
        date: '明天 6月10日',
        items: [
          { title: '新功能培训会', time: '19:00-21:00', code: '733 9552 1893', tag: '周期' }
        ]
      },
      {
        date: '周四 6月11日',
        items: [
          { title: '【客】浦发银行腾会项目群周会', time: '14:00-15:00', code: '406 3626 2174', tag: '周期' }
        ]
      },
      {
        date: '周五 6月12日',
        items: [
          { title: '腾讯会议渠道经理培训会', time: '09:00-11:00', code: '892 1034 5671', tag: '' }
        ]
      }
    ];

    function renderMeetings() {
      const container = document.getElementById('meetingList');
      container.innerHTML = mockMeetings.map(group => `
        <div class="date-group">
          <div class="date-label">${group.date}</div>
          ${group.items.map(m => `
            <div class="meeting-item">
              <div class="meeting-title">${m.title}</div>
              <div class="meeting-meta">
                <span>${m.time}</span>
                <span class="dot"></span>
                <span>${m.code}</span>
                ${m.tag ? `<span class="meeting-tag">· ${m.tag}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
    renderMeetings();

    // 按钮事件
    document.getElementById('btnJoin').addEventListener('click', async () => {
      try {
        const result = await window.electronAPI.showJoinMeetingView();
        if (!result.success) alert(result.message || '无法打开加入会议界面');
      } catch (err) {
        alert('操作失败: ' + err.message);
      }
    });

    document.getElementById('btnQuick').addEventListener('click', async () => {
      try {
        const result = await window.electronAPI.quickMeeting();
        if (!result.success) alert(result.message || '无法发起快速会议');
      } catch (err) {
        alert('操作失败: ' + err.message);
      }
    });

    document.getElementById('btnSchedule').addEventListener('click', async () => {
      try {
        const result = await window.electronAPI.showScheduleMeetingView(0);
        if (!result.success) alert(result.message || '无法打开预定会议界面');
      } catch (err) {
        alert('操作失败: ' + err.message);
      }
    });

    document.getElementById('btnScreen').addEventListener('click', async () => {
      try {
        const result = await window.electronAPI.showScreenCastView();
        if (!result.success) alert(result.message || '无法打开共享屏幕界面');
      } catch (err) {
        alert('操作失败: ' + err.message);
      }
    });

    // 头像菜单
    const userAvatar = document.getElementById('userAvatarNav');
    const avatarMenu = document.getElementById('avatarMenu');

    function toggleMenu(e) {
      e.stopPropagation();
      const rect = userAvatar.getBoundingClientRect();
      avatarMenu.style.left = rect.left + 'px';
      avatarMenu.style.top = (rect.bottom + 4) + 'px';
      avatarMenu.classList.toggle('show');
    }

    userAvatar.addEventListener('click', toggleMenu);

    document.addEventListener('click', () => {
      avatarMenu.classList.remove('show');
    });

    avatarMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // 退出登录
    document.getElementById('logoutMenu').addEventListener('click', async () => {
      avatarMenu.classList.remove('show');
      await window.electronAPI.logout();
    });

    // 修改密码弹窗
    const modal = document.getElementById('changePasswordModal');
    const oldPwdInput = document.getElementById('oldPassword');
    const newPwdInput = document.getElementById('newPassword');
    const confirmPwdInput = document.getElementById('confirmPassword');
    const modalError = document.getElementById('changePasswordError');
    const modalSuccess = document.getElementById('changePasswordSuccess');
    const submitBtn = document.getElementById('submitChangePassword');

    document.getElementById('changePasswordMenu').addEventListener('click', () => {
      avatarMenu.classList.remove('show');
      oldPwdInput.value = '';
      newPwdInput.value = '';
      confirmPwdInput.value = '';
      modalError.textContent = '';
      modalSuccess.textContent = '';
      modal.classList.add('show');
    });

    document.getElementById('cancelChangePassword').addEventListener('click', () => {
      modal.classList.remove('show');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('show');
      }
    });

    submitBtn.addEventListener('click', async () => {
      const oldPassword = oldPwdInput.value;
      const newPassword = newPwdInput.value;
      const confirmPassword = confirmPwdInput.value;

      modalError.textContent = '';
      modalSuccess.textContent = '';

      if (!oldPassword || !newPassword || !confirmPassword) {
        modalError.textContent = '请填写所有字段';
        return;
      }
      if (newPassword !== confirmPassword) {
        modalError.textContent = '两次输入的新密码不一致';
        return;
      }
      if (newPassword.length < 8) {
        modalError.textContent = '新密码需至少 8 位';
        return;
      }
      if (!/[A-Z]/.test(newPassword)) {
        modalError.textContent = '新密码需包含至少一个大写字母';
        return;
      }
      if (!/[a-z]/.test(newPassword)) {
        modalError.textContent = '新密码需包含至少一个小写字母';
        return;
      }
      if (!/[0-9]/.test(newPassword)) {
        modalError.textContent = '新密码需包含至少一个数字';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '修改中...';

      try {
        const result = await window.electronAPI.changePassword(oldPassword, newPassword);
        if (result.success) {
          modalSuccess.textContent = '密码修改成功';
          setTimeout(() => {
            modal.classList.remove('show');
            modalSuccess.textContent = '';
          }, 1500);
        } else {
          modalError.textContent = result.message || '修改失败';
        }
      } catch (err) {
        modalError.textContent = '网络错误，请稍后重试';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '确认修改';
      }
    });

    // 初始化
    loadProfile();
  </script>
</body>
</html>
