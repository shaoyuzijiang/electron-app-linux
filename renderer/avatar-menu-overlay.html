<!DOCTYPE html>
<!--
  头像下拉菜单悬浮窗口内容。
  独立的无边框透明子窗口，渲染在主窗口所有子视图（包括企业 webview）之上，
  参见 utils/avatar-menu-window.js 顶部说明。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>avatar-menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* #menuBox 的 top/left 偏移必须与主进程 SHADOW_BUFFER 保持一致，
       用来给 box-shadow 留出渲染空间，避免被窗口边界裁切 */
    #menuBox {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid #e8e8e8;
      min-width: 160px;
      padding: 6px 0;
    }
    .avatar-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .avatar-menu-item:hover {
      background: #f0f0f0;
    }
    .avatar-menu-item.danger {
      color: #ff4d4f;
    }
    .avatar-menu-divider {
      height: 1px;
      background: #eee;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="menuBox">
    <div class="avatar-menu-item" data-action="change-password">修改密码</div>
    <div class="avatar-menu-item" data-action="upload-logs">上传腾讯会议日志</div>
    <div class="avatar-menu-item" id="enterpriseAdminItem" data-action="enterprise-admin" style="display:none;">企业管理</div>
    <div class="avatar-menu-divider"></div>
    <div class="avatar-menu-item" data-action="about">关于</div>
    <div class="avatar-menu-item danger" data-action="logout">退出登录</div>
  </div>

  <script>
    (function () {
      const enterpriseItem = document.getElementById('enterpriseAdminItem');

      // 主进程通过此事件传入是否显示「企业管理」项
      if (window.electronAPI && window.electronAPI.onAvatarMenuInit) {
        window.electronAPI.onAvatarMenuInit((data) => {
          if (enterpriseItem) {
            enterpriseItem.style.display = data && data.showEnterpriseAdmin ? 'flex' : 'none';
          }
        });
      }

      document.querySelectorAll('.avatar-menu-item').forEach((item) => {
        item.addEventListener('click', () => {
          const action = item.getAttribute('data-action');
          if (action && window.electronAPI && window.electronAPI.sendAvatarMenuItemClick) {
            window.electronAPI.sendAvatarMenuItemClick(action);
          }
        });
      });
    })();
  </script>
</body>
</html>
