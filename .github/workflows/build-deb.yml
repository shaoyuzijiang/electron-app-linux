name: build-linux-deb

# 推送即自动构建 Linux ARM64 DEB 安装包。
# 一次性前置（见 docs/AUTOPACK_PLAN.md）：把 SDK 归档与 Electron zip
# 作为 Release 附件上传到 tag `vendor-supplies`。
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载离线供应物（SDK 归档 / Electron runtime）
        run: |
          mkdir -p vendor
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies"
          curl --fail --location --retry 3 \
            -o vendor/TMSDK_0300000000_3.26.100.14_arm64_default.publish.tar.gz \
            "$base/TMSDK_0300000000_3.26.100.14_arm64_default.publish.tar.gz"
          curl --fail --location --retry 3 \
            -o vendor/electron-v33.4.11-linux-arm64.zip \
            "$base/electron-v33.4.11-linux-arm64.zip"

      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      # 门禁测试只需 electron 包可被 require（返回二进制路径字符串），
      # 跳过其下载脚本后手动补元数据满足 require 检查
      - name: 补齐 electron 包元数据
        run: |
          printf 'electron' > node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist

      - name: 门禁测试
        run: npm run verify:platform-contract

      - name: 准备 SDK 运行时与预编译 addon
        run: |
          mkdir -p sdk-extract
          tar -xzf vendor/TMSDK_0300000000_3.26.100.14_arm64_default.publish.tar.gz -C sdk-extract
          bash scripts/prepare-sdk.sh "$(echo sdk-extract/TMSDK_*)"
          cp packaging/prebuilt/wemeet_electron_sdk.arm64.node output/linux/wemeet_electron_sdk.node

      - name: 组装 DEB
        run: WEMEET_CI=1 bash scripts/build-deb.sh

      - name: 校验 DEB
        run: npm run check -- --deb

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: dist-demo/*.deb
          if-no-files-found: error

      # main 分支的构建自动发布到 Release `latest`。
      # 资产命名与 Mac/Windows 下载页对齐：腾讯会议SDK Demo-<版本>-<日期>-arm64.deb
      # 每次发布覆盖式更新：只保留最新一个资产，旧日期的自动清理。
      - name: 发布到 Release 页
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DEB="$(ls dist-demo/*.deb)"
          NEW_NAME="$(basename "$DEB")"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          REPO_API="repos/${GITHUB_REPOSITORY}"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）"
          # 含空格/中文的文件名经 gh release upload 会被改名，导致后续清理误删；
          # 故先用 ASCII 临时名上传，再通过 API 精确改名为目标名。
          cp "$DEB" dist-demo/upload-tmp.deb
          gh release upload latest dist-demo/upload-tmp.deb --clobber
          RELEASE_ID="$(gh api "$REPO_API/releases/tags/latest" --jq '.id')"
          ASSET_ID="$(gh api "$REPO_API/releases/$RELEASE_ID/assets" --jq '.[] | select(.name=="upload-tmp.deb") | .id')"
          gh api -X PATCH "$REPO_API/releases/assets/$ASSET_ID" -f name="$NEW_NAME" >/dev/null
          # 清理旧日期资产，只保留本次
          gh api "$REPO_API/releases/$RELEASE_ID/assets" --jq '.assets[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$NEW_NAME" ]]; then
              gh api -X DELETE "$REPO_API/releases/assets/$assetId" >/dev/null
              echo "已清理旧资产: $assetName"
            fi
          done
          gh release edit latest \
            --title "最新安装包（自动构建）" \
            --notes "版本 $VERSION ｜ 构建于 $BUILD_TIME ｜ 银河麒麟 V10 ARM64。安装：sudo dpkg -i \"$NEW_NAME\""
          echo "已发布资产: $NEW_NAME"
