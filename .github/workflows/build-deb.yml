name: build-linux-deb

# 【备用/回退流水线】仅手动触发的 Linux ARM64 DEB 构建+发布。
# 三端自动发布已由 build-all.yml 承接（main push）。
# 回退到"仅 DEB 发布"模式：放开下方 push 触发 + 恢复 build-all.yml 至 277b09a
# （详见 docs/EXECUTION_PLAN.md 第十节）。
# 一次性前置（见 docs/AUTOPACK_PLAN.md）：把 SDK 归档与 Electron zip
# 作为 Release 附件上传到 tag `vendor-supplies`。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Electron 版本单一来源：package.json（升级只改 package.json 一处）
      - name: 解析 Electron 版本
        run: echo "ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_ENV"
      - name: 下载离线供应物（SDK 归档 / Electron runtime）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies"
          # SDK 归档按通配下载（升级 SDK 版本无需改本文件）；Electron zip 名派生自 package.json
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" \
            -p 'TMSDK_*_arm64_default.publish.tar.gz' -D vendor
          curl --fail --location --retry 3 \
            -o "vendor/electron-v${ELECTRON_VERSION}-linux-arm64.zip" \
            "$base/electron-v${ELECTRON_VERSION}-linux-arm64.zip"
          # 供应物完整性校验（防 --clobber 误覆盖/传输损坏）
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS' -O vendor/SHA256SUMS
          cd vendor
          grep -E 'electron-v[0-9]|TMSDK_.*\.tar\.gz$' SHA256SUMS | sha256sum -c -

      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      # 门禁测试只需 electron 包可被 require（返回二进制路径字符串），
      # 跳过其下载脚本后手动补元数据满足 require 检查
      - name: 补齐 electron 包元数据
        run: |
          printf 'electron' > node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist

      - name: 门禁测试
        run: npm run verify:platform-contract

      - name: 准备 SDK 运行时与预编译 addon
        run: |
          mkdir -p sdk-extract
          tar -xzf vendor/TMSDK_0300000000_3.26.100.14_arm64_default.publish.tar.gz -C sdk-extract
          bash scripts/prepare-sdk.sh "$(echo sdk-extract/TMSDK_*)"
          cp packaging/prebuilt/wemeet_electron_sdk.arm64.node output/linux/wemeet_electron_sdk.node

      - name: 组装 DEB
        run: WEMEET_CI=1 bash scripts/build-deb.sh

      - name: 校验 DEB
        run: npm run check -- --deb

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: dist-demo/*.deb
          if-no-files-found: error

      # 手动构建发布到 Release `latest`。清理只删旧 *.deb，不碰 dmg/exe
      # （三端资产共存；与 build-all.yml 的平台隔离清理策略一致）。
      - name: 发布到 Release 页
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUILD_DATE="$(ls dist-demo/*.deb | grep -oE '[0-9]{8}' | head -1)"
          DEB="$(ls dist-demo/*.deb)"
          # GitHub 资产名不支持中文/空格，Release 侧用 ASCII 名；
          # 中文命名的原始产物保留在 Actions 产物 linux-arm64-deb 中（供下载页直接上传）
          ASCII_NAME="tencent-meeting-sdk-demo-${VERSION}-${BUILD_DATE}-arm64.deb"
          cp "$DEB" "dist-demo/$ASCII_NAME"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）"
          gh release upload latest "dist-demo/$ASCII_NAME" --clobber
          # 清理旧 DEB（按 id 操作；资产名可能以 - 开头，按名传参会误当选项）
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name | endswith(".deb")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$ASCII_NAME" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$assetId" >/dev/null
              echo "已清理旧 DEB: $assetName"
            fi
          done
          echo "已发布资产: $ASCII_NAME"
