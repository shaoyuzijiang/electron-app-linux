name: build-all-platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rehearse/electron-app-merge
    # 纯文档改动不触发构建（每次三端构建 ≈130 计费分钟，私有仓库额度有限）；
    # workflow 文件改动也不触发（workflow 验证靠手动 dispatch 更直接）；
    # 需要手动构建时用 workflow_dispatch
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'

# 三端发布流水线：
#   - main push：三端并行构建，各自发布到 Release latest（每平台只保留最新一个资产）
#   - 其他分支（如 rehearse/*）：只构建并上传 Actions 产物，不碰 Release
#
# 【一键回退到"仅 DEB 发布"模式】（两步，详见 docs/EXECUTION_PLAN.md 第十节）：
#   1. 恢复 build-deb.yml 的 push: main 触发（该文件保留完整发布能力，只是触发放开）
#   2. git checkout 277b09a -- .github/workflows/build-all.yml
#      （277b09a 为本改造前版本：build-all 只做演练构建、build-deb 独占发布）
permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Electron 版本单一来源：package.json（升级只改 package.json 一处）
      - name: 解析 Electron 版本
        run: echo "ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_ENV"
      - name: 下载离线供应物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies"
          # SDK 归档按通配下载（升级 SDK 版本无需改本文件）；Electron zip 名派生自 package.json
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" \
            -p 'TMSDK_*_arm64_default.publish.tar.gz' -D vendor
          curl --fail --location --retry 3 -o "vendor/electron-v${ELECTRON_VERSION}-linux-arm64.zip" "$base/electron-v${ELECTRON_VERSION}-linux-arm64.zip"
          # 供应物完整性校验（防 --clobber 误覆盖/传输损坏）
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS' -O vendor/SHA256SUMS
          cd vendor
          grep -E 'electron-v[0-9]-linux-arm64|TMSDK_.*arm64.*\.tar\.gz$' SHA256SUMS | sha256sum -c -
      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      # 门禁脚本 require('electron') 需要包元数据；--ignore-scripts 跳过了其安装脚本，
      # 手动补齐（与 build-deb.yml 同款）
      - name: 补齐 electron 包元数据
        run: |
          printf 'electron' > node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
      - name: 门禁测试
        run: npm run verify:platform-contract
      - name: 准备 SDK 与预编译 addon
        run: |
          mkdir -p sdk-extract output/linux
          tar -xzf vendor/TMSDK_*_arm64_default.publish.tar.gz -C sdk-extract
          bash scripts/prepare-sdk.sh "$(echo sdk-extract/TMSDK_*)"
          cp packaging/prebuilt/wemeet_electron_sdk.arm64.node output/linux/wemeet_electron_sdk.node
      - name: 组装 DEB
        run: WEMEET_CI=1 bash scripts/build-deb.sh
      - name: 校验 DEB
        run: npm run check -- --deb
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: dist-demo/*.deb
          if-no-files-found: error
      # 发布到 Release latest（仅 main）。清理只删旧 *.deb，不碰 dmg/exe（三端资产共存）。
      # 资产删除一律按 id 操作（资产名可能以 - 开头，按名传参会误当选项）。
      - name: 发布到 Release latest（仅 main）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUILD_DATE="$(ls dist-demo/*.deb | grep -oE '[0-9]{8}' | head -1)"
          DEB="$(ls dist-demo/*.deb)"
          ASCII_NAME="tencent-meeting-sdk-demo-${VERSION}-${BUILD_DATE}-arm64.deb"
          cp "$DEB" "dist-demo/$ASCII_NAME"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）" || true
          gh release upload latest "dist-demo/$ASCII_NAME" --clobber
          # 只清理旧 arm64 DEB（不碰 x64 deb / dmg / exe，坑 28：平台+架构隔离）
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name | endswith("-arm64.deb")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$ASCII_NAME" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$assetId" >/dev/null
              echo "已清理旧 DEB: $assetName"
            fi
          done
          echo "已发布资产: $ASCII_NAME"

  linux-deb-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 解析 Electron 版本
        run: echo "ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_ENV"
      - name: 下载 x86_64 供应物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies"
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" \
            -p 'TMSDK_*_x86_64_default.publish.tar.gz' -D vendor
          curl --fail --location --retry 3 -o "vendor/electron-v${ELECTRON_VERSION}-linux-x64.zip" "$base/electron-v${ELECTRON_VERSION}-linux-x64.zip"
          gh release download vendor-supplies -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS' -O vendor/SHA256SUMS
          cd vendor
          grep -E 'electron-v[0-9]-linux-x64|TMSDK_.*x86_64.*\.tar\.gz$' SHA256SUMS | sha256sum -c -
      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      - name: 补齐 electron 包元数据
        run: |
          printf 'electron' > node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
      - name: 门禁测试
        run: npm run verify:platform-contract
      - name: 准备 x86_64 SDK 与预编译 addon
        run: |
          mkdir -p sdk-extract output/linux
          tar -xzf vendor/TMSDK_*_x86_64_default.publish.tar.gz -C sdk-extract
          SDK_ARCH=x86_64 bash scripts/prepare-sdk.sh "$(echo sdk-extract/TMSDK_*)"
          # x64 预编译 addon 需在 x86 麒麟基线机编译回传（K1）；
          # 未就位时明确跳过组装（标黄提示），不影响其他平台
          if [ -f packaging/prebuilt/wemeet_electron_sdk.x64.node ]; then
            cp packaging/prebuilt/wemeet_electron_sdk.x64.node output/linux/wemeet_electron_sdk.node
            echo "OUTPUT_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::packaging/prebuilt/wemeet_electron_sdk.x64.node 未就位（需 x86 基线机回传），跳过 x64 DEB 组装"
            echo "OUTPUT_EXISTS=0" >> "$GITHUB_ENV"
          fi
      - name: 组装 x64 DEB
        if: env.OUTPUT_EXISTS == '1'
        run: LINUX_ARCH=x64 WEMEET_CI=1 bash scripts/build-deb.sh
      - name: 校验 DEB
        if: env.OUTPUT_EXISTS == '1'
        run: npm run check -- --deb
      - name: 上传产物
        if: env.OUTPUT_EXISTS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: dist-demo/*.deb
          if-no-files-found: error
      - name: 发布到 Release latest（仅 main）
        if: github.ref == 'refs/heads/main' && env.OUTPUT_EXISTS == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUILD_DATE="$(ls dist-demo/*.deb | grep -oE '[0-9]{8}' | head -1)"
          DEB="$(ls dist-demo/*.deb)"
          ASCII_NAME="tencent-meeting-sdk-demo-${VERSION}-${BUILD_DATE}-x64.deb"
          cp "$DEB" "dist-demo/$ASCII_NAME"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）" || true
          gh release upload latest "dist-demo/$ASCII_NAME" --clobber
          # 只清理旧 x64 DEB（不碰 arm64 deb / dmg / exe）
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name | endswith("-x64.deb")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$ASCII_NAME" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$assetId" >/dev/null
              echo "已清理旧 x64 DEB: $assetName"
            fi
          done
          echo "已发布资产: $ASCII_NAME"

  mac-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载 mac Framework 供应物
        run: |
          mkdir -p wemeet_sdk/mac/Frameworks/arm64 wemeet_sdk/mac/Frameworks/x86_64
          curl --fail --location --retry 3 -o /tmp/TMSDK.framework.arm64.zip "https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies/TMSDK.framework.arm64.zip"
          # 供应物完整性校验（防 --clobber 误覆盖/传输损坏）
          curl --fail --location --retry 3 -o /tmp/SHA256SUMS "https://github.com/${GITHUB_REPOSITORY}/releases/download/vendor-supplies/SHA256SUMS"
          grep 'TMSDK.framework.arm64.zip' /tmp/SHA256SUMS | (cd /tmp && shasum -a 256 -c -)
          ditto -x -k /tmp/TMSDK.framework.arm64.zip wemeet_sdk/mac/Frameworks/arm64/
          ln -s ../arm64/TMSDK.framework wemeet_sdk/mac/Frameworks/x86_64/TMSDK.framework
      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      - name: 编译原生 addon（arm64）
        run: npm run build:native:mac-arm64
      - name: 打包 DMG（跳过签名，禁用发布）
        run: SKIP_SIGN=1 npm run dist:mac:arm64 -- --publish never
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
      # 发布到 Release latest（仅 main）。清理只删旧 *.dmg，不碰 deb/exe。
      - name: 发布到 Release latest（仅 main）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DMG="$(ls dist/*.dmg | head -1)"
          BUILD_DATE="$(basename "$DMG" | grep -oE '[0-9]{8}' | head -1)"
          ASCII_NAME="tencent-meeting-sdk-demo-${VERSION}-${BUILD_DATE}-mac-arm64.dmg"
          cp "$DMG" "dist/$ASCII_NAME"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）" || true
          gh release upload latest "dist/$ASCII_NAME" --clobber
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name | endswith(".dmg")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$ASCII_NAME" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$assetId" >/dev/null
              echo "已清理旧 DMG: $assetName"
            fi
          done
          echo "已发布资产: $ASCII_NAME"

  win-nsis:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载 win SDK 运行时供应物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wemeet_sdk\win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/vendor-supplies/wemeet-sdk-win-x64-runtime.zip" -OutFile win-runtime.zip
          # 供应物完整性校验（防 --clobber 误覆盖/传输损坏）
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/vendor-supplies/SHA256SUMS" -OutFile SHA256SUMS
          $expected = (Select-String -Path SHA256SUMS -Pattern 'wemeet-sdk-win-x64-runtime\.zip').Line.Split(' ')[0].Trim()
          $actual = (Get-FileHash win-runtime.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "SHA256 校验失败: win-runtime.zip (期望 $expected, 实际 $actual)" }
          Expand-Archive -Path win-runtime.zip -DestinationPath wemeet_sdk\win -Force
      - name: 安装依赖
        run: npm ci --include=dev --ignore-scripts
      - name: 编译原生 addon（x64）
        run: npm run build:native:win-x64
      - name: 打包 NSIS
        run: npm run dist:win:x64
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-nsis
          path: dist/*.exe
          if-no-files-found: error
      # 发布到 Release latest（仅 main）。清理只删旧 *.exe，不碰 deb/dmg。
      # 用 bash 跑发布脚本（Git Bash 自带），复用与另两个 job 相同的 gh 用法
      - name: 发布到 Release latest（仅 main）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXE="$(ls dist/*.exe | head -1)"
          BUILD_DATE="$(basename "$EXE" | grep -oE '[0-9]{8}' | head -1)"
          ASCII_NAME="tencent-meeting-sdk-demo-${VERSION}-${BUILD_DATE}-win-x64.exe"
          cp "$EXE" "dist/$ASCII_NAME"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新安装包（自动构建）" || true
          gh release upload latest "dist/$ASCII_NAME" --clobber
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name | endswith(".exe")) | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r assetId assetName; do
            if [[ "$assetName" != "$ASCII_NAME" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$assetId" >/dev/null
              echo "已清理旧 EXE: $assetName"
            fi
          done
          echo "已发布资产: $ASCII_NAME"
